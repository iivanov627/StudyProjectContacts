spring.application.name=StudyProjectWebStart

# db settings
spring.datasource.url=jdbc:sqlite:contact.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# level of logging
logging.level.ru.ksergey.StudyProjectWebStart=DEBUG
logging.level.org.springframework=INFO

# path and name of log file
logging.file.name=logs/contact-app.log

# settings of files rotation
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# format of log input
logging.pattern.console=%d{HH:mm:ss} %-5level [%logger] - %msg%n

# executing script data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true